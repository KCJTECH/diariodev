<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/data.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:hover{color:var(--brand-text)}
  input,button{font-family:inherit;font-size:inherit;color:inherit}
  @keyframes dvUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border:3px solid var(--bg);border-radius:8px}
</style>
</helmet>

<x-import component-from-global-scope="app-shell" from="./assets/app-shell.js"
  page="pesquisa" heading="Auditoria" subtitle="Rastreie qualquer registro por pessoa, projeto, categoria ou palavra" hint-size="100%,100%">

  <div slot="actions" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end">
    <a href="atividades.dc.html?nova=1" style="display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:6px;background:var(--accent);color:#fff;font-size:.85rem;font-weight:600;white-space:nowrap" style-hover="filter:brightness(1.08);color:#ffffff">
        <span style="font-size:1rem;line-height:1">+</span> Nova atividade
      </a>
  </div>

  <main data-screen-label="Pesquisa Global" style="flex:1;padding:26px 28px 64px;max-width:1100px;width:100%;display:flex;flex-direction:column;gap:16px;animation:dvUp .22s ease both">

      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px">
        <div style="display:flex;align-items:center;gap:10px;border:1.5px solid var(--border);border-radius:8px;padding:12px 14px">
          <span style="color:var(--text-faint);font-size:1.05rem">⌕</span>
          <input value="{{ q }}" onChange="{{ onQ }}" ref="{{ inputRef }}" placeholder="Ex.: timeout, Laerty, Portal ITS, Correção…" style="flex:1;border:none;outline:none;font-size:.95rem;background:transparent" />
          <span style="font-family:ui-monospace,monospace;font-size:.68rem;color:var(--text-faint);background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:2px 6px">⌘K</span>
        </div>
        <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;align-items:center">
          <span style="font-size:.72rem;color:var(--text-faint);font-weight:600">Sugestões:</span>
          <sc-for list="{{ suggestions }}" as="s" hint-placeholder-count="5">
            <div onClick="{{ s.onClick }}" style="font-size:.76rem;color:var(--brand-text);background:var(--tint-blue);border:1px solid var(--tint-blue-bd);border-radius:20px;padding:3px 11px;cursor:pointer" style-hover="filter:brightness(.97)">{{ s.label }}</div>
          </sc-for>
        </div>
      </div>

      <div style="font-size:.78rem;color:var(--text-muted)">{{ line }}</div>

      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
        <div>
          <div style="font-size:.75rem;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">{{ g.label }}</div>
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">
            <sc-for list="{{ g.items }}" as="r" hint-placeholder-count="3">
              <a href="{{ r.href }}" style="display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--border-soft);color:var(--text)" style-hover="background:var(--surface-2);color:var(--text)">
                <div style="{{ r.iconStyle }}">{{ r.icon }}</div>
                <div style="flex:1;min-width:0">
                  <div style="font-size:.86rem;font-weight:600">{{ r.title }}</div>
                  <div style="font-size:.75rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.sub }}</div>
                </div>
                <div style="font-size:.73rem;color:var(--text-faint);white-space:nowrap">{{ r.meta }}</div>
              </a>
            </sc-for>
          </div>
        </div>
      </sc-for>

      <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:52px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
          <div style="width:48px;height:48px;border-radius:calc(var(--radius) + 2px);background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:1.3rem">⌕</div>
          <div style="font-size:.95rem;font-weight:700">Nada encontrado para “{{ q }}”</div>
          <div style="font-size:.82rem;color:var(--text-muted);max-width:380px;text-wrap:pretty">Tente o nome de um projeto, uma pessoa, uma categoria ou uma palavra do título.</div>
        </div>
      </sc-if>
    </main>
</x-import>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:880}}">
class Component extends DCLogic {
  state = { ready: false, collapsed: false, q: '' };
  componentDidMount() {
    this.t = setInterval(() => {
      if (!window.DV) return;
      clearInterval(this.t);
      const p = new URLSearchParams(window.location.search);
      this.setState({ ready: true, q: p.get('q') || '' });
    }, 25);
  }
  componentWillUnmount() { clearInterval(this.t); }

  renderVals() {
    const D = window.DV;
    if (!D) return { nav: [], sb: {}, u: {}, groups: [], suggestions: [] };
    const u = D.user();
    const acts = D.acts();
    const q = this.state.q.trim().toLowerCase();
    const icon = (bg, fg) => 'width:30px;height:30px;flex:0 0 30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;background:' + bg + ';color:' + fg;

    const matched = q
      ? acts.filter(a => (a.title + ' ' + a.desc + ' ' + a.proj + ' ' + a.cat + ' ' + ((D.person(a.who) || {}).name || '') + ' ' + a.tags.join(' ')).toLowerCase().indexOf(q) > -1)
      : acts.slice(0, 6);

    const groups = [];
    const pMatch = q ? D.people().filter(p => (p.name + ' ' + p.role).toLowerCase().indexOf(q) > -1) : [];
    if (pMatch.length) groups.push({
      label: 'Colaboradores',
      items: pMatch.map(p => ({
        href: 'colaborador.dc.html?id=' + p.id, title: p.name, sub: p.role,
        meta: D.plural(acts.filter(a => a.who === p.id).length), icon: p.ini, iconStyle: icon(p.color, 'var(--surface)')
      }))
    });
    const prMatch = q ? D.projects().filter(p => p.toLowerCase().indexOf(q) > -1) : [];
    if (prMatch.length) groups.push({
      label: 'Projetos',
      items: prMatch.map(p => ({
        href: 'projeto.dc.html?p=' + encodeURIComponent(p), title: p,
        sub: D.plural(acts.filter(a => a.proj === p).length), meta: 'projeto', icon: '◈', iconStyle: icon('var(--tint-blue)', 'var(--brand)')
      }))
    });
    if (matched.length) groups.push({
      label: q ? 'Atividades' : 'Registros recentes',
      items: matched.slice(0, 12).map(a => {
        const p = D.person(a.who) || u;
        return {
          href: 'atividades.dc.html?editar=' + a.id, title: a.title,
          sub: p.name + ' · ' + a.proj + ' · ' + a.cat, meta: D.fmt(a.d),
          icon: '≡', iconStyle: icon('var(--bg)', 'var(--brand)')
        };
      })
    });

    return {
      q: this.state.q,
      onQ: (e) => this.setState({ q: e.target.value }),
      inputRef: (el) => { if (el && !this._f) { this._f = true; setTimeout(() => { el.focus(); this._f = false; }, 60); } },
      suggestions: ['Laerty', 'Portal ITS', 'Correção', 'timeout', 'Entrega'].map(s => ({ label: s, onClick: () => this.setState({ q: s }) })),
      line: q ? groups.reduce((n, g) => n + g.items.length, 0) + ' resultados para “' + this.state.q + '”' : 'Digite para pesquisar — mostrando os registros mais recentes',
      isEmpty: !!q && groups.length === 0,
      groups: groups
    };
  }
}

</script>
</body>
</html>
