# Diário Dev — ambiente completo para desenvolvimento/homologação.
# Produção deve usar segredos gerenciados e não os valores deste arquivo.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: diariodev
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: diariodev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diariodev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: change_me_minio
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: node dist/src/server.js
    env_file: .env
    environment:
      DATABASE_URL: postgresql://diariodev:change_me@postgres:5432/diariodev?schema=public
      REDIS_URL: redis://redis:6379
      # APP_ORIGIN e ALLOW_DEV_LOGIN vêm do .env. Defina APP_ORIGIN com o IP/host real
      # de acesso (ex.: http://10.70.1.135:3333), senão as mutações do navegador são
      # bloqueadas por origem.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3333:3333"

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: node dist/src/workers/index.js
    env_file: .env
    environment:
      DATABASE_URL: postgresql://diariodev:change_me@postgres:5432/diariodev?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  miniodata:
